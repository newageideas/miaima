<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Code notes — MAI / IMA</title><meta name="robots" content="noindex">
<style>
:root{--bg:#0a0c10;--card:#12151c;--line:#333d52;--tx:#f1f5f9;--mut:#94a3b8;--acc:#6366f1;--cy:#38bdf8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Inter,-apple-system,system-ui,sans-serif;padding:16px 14px calc(24px + env(safe-area-inset-bottom))}
main{max-width:820px;margin:0 auto}h1{font:800 22px JetBrains Mono,monospace;margin:4px 0}h1 span{color:var(--cy)}p.sub{color:var(--mut);margin:0 0 16px;font-size:13px}
.card{background:var(--card);border:1px solid #222938;border-radius:14px;padding:14px;margin-bottom:14px}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 4px}
input,textarea{width:100%;background:#0a0c10;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:16px}
textarea{min-height:42vh;font:13px/1.45 "JetBrains Mono",ui-monospace,monospace;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}button,.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:12px 14px;font-weight:700;font-size:14px;cursor:pointer;min-height:44px;text-decoration:none;display:inline-flex;align-items:center}
.ghost{background:transparent;border:1px solid var(--line);color:#cbd5e1}.danger{background:transparent;border:1px solid #ef444466;color:#fca5a5}
.meta{color:var(--mut);font-size:12px}.note h3{margin:0 0 2px;font-size:16px}pre{background:#0a0c10;border:1px solid #222938;border-radius:10px;padding:10px;max-height:260px;overflow:auto;font:12px "JetBrains Mono",monospace;white-space:pre-wrap;word-break:break-word;margin:8px 0 0}
#msg{min-height:20px;font-size:13px;color:#fbbf24;margin-top:8px}.hide{display:none}
</style>
</head>
<body><main>
  <a href="/" class="meta" style="color:var(--cy)">← Back to Trend Picker</a>
  <h1>Code <span>notes</span></h1>
  <p class="sub">Paste code here from any phone or computer — it's saved privately so the team can copy it later or send it to Mia to preview. Paste the code as text (screenshots can't be copied).</p>

  <section class="card" id="lock">
    <label for="pass">Shared passcode</label>
    <input id="pass" type="password" autocomplete="current-password" placeholder="Ask Ima for the passcode">
    <div class="row"><button id="unlock">Unlock</button></div>
  </section>

  <section class="card hide" id="composer">
    <label for="author">Your name</label><input id="author" autocomplete="name" placeholder="e.g. Sasha Mai Hernandez">
    <label for="title">Title</label><input id="title" placeholder="e.g. Galaxy background CSS (radial gradients + keyframes)">
    <label for="code">Code</label><textarea id="code" spellcheck="false" autocapitalize="off" autocorrect="off" placeholder="Paste HTML / CSS / JS — any length"></textarea>
    <div class="meta" id="stats"></div>
    <div class="row"><button id="save">💾 Save note</button><button class="ghost" id="lockBtn" type="button">🔒 Lock</button></div>
  </section>
  <div id="msg" role="status"></div>
  <section id="list"></section>
</main>
<script>
(function(){
  var $=function(i){return document.getElementById(i)}, pass="";
  try{pass=localStorage.getItem("mia_notes_pass")||"";$("author").value=localStorage.getItem("mia_notes_author")||"";}catch(e){}
  function msg(t){$("msg").textContent=t||""}
  function api(method,body,q){return fetch("/api/notes"+(q||""),{method:method,headers:{"Content-Type":"application/json","x-notes-passcode":pass},body:body?JSON.stringify(body):undefined}).then(function(r){return r.json().catch(function(){return{}}).then(function(d){if(!r.ok){var e=new Error(d.error||("HTTP "+r.status));e.status=r.status;throw e}return d})})}
  function unlocked(on){$("lock").classList.toggle("hide",on);$("composer").classList.toggle("hide",!on)}
  function load(){msg("Loading…");return api("GET").then(function(d){unlocked(true);msg("");render(d.notes||[])}).catch(function(e){if(e.status===401){unlocked(false);pass="";try{localStorage.removeItem("mia_notes_pass")}catch(x){};msg("Wrong passcode.")}else msg("⚠️ "+e.message)})}
  function render(notes){
    var L=$("list");L.innerHTML="";if(!notes.length){L.innerHTML='<p class="meta">No notes yet.</p>';return}
    notes.forEach(function(n){
      var c=document.createElement("article");c.className="card note";
      var h=document.createElement("h3");h.textContent=n.title;
      var m=document.createElement("div");m.className="meta";m.textContent=n.author+" · "+new Date(n.createdAt).toLocaleString()+" · "+n.code.split("\n").length+" lines";
      var pre=document.createElement("pre");pre.textContent=n.code;
      var row=document.createElement("div");row.className="row";
      var cp=document.createElement("button");cp.textContent="📋 Copy";cp.onclick=function(){(navigator.clipboard?navigator.clipboard.writeText(n.code):Promise.reject()).then(function(){cp.textContent="Copied ✓"},function(){var t=document.createElement("textarea");t.value=n.code;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove();cp.textContent="Copied ✓"});setTimeout(function(){cp.textContent="📋 Copy"},1500)};
      var bot=document.createElement("a");bot.className="btn ghost";bot.href="/#note="+encodeURIComponent(n.id);bot.textContent="✨ Send to Mia to preview/add";
      var dl=document.createElement("button");dl.className="danger";dl.textContent="🗑 Delete";dl.onclick=function(){if(!confirm("Delete “"+n.title+"”?"))return;api("DELETE",null,"?id="+encodeURIComponent(n.id)).then(load).catch(function(e){msg("⚠️ "+e.message)})};
      row.append(cp,bot,dl);c.append(h,m,pre,row);L.appendChild(c)})
  }
  $("unlock").onclick=function(){pass=$("pass").value.trim();if(!pass)return;try{localStorage.setItem("mia_notes_pass",pass)}catch(e){};load()};
  $("pass").addEventListener("keydown",function(e){if(e.key==="Enter")$("unlock").click()});
  $("lockBtn").onclick=function(){pass="";try{localStorage.removeItem("mia_notes_pass")}catch(e){};$("list").innerHTML="";unlocked(false)};
  $("code").addEventListener("input",function(){var c=$("code").value;$("stats").textContent=c?c.split("\n").length+" lines · "+c.length.toLocaleString()+" chars":""});
  $("save").onclick=function(){var code=$("code").value;if(!code.trim()){msg("Paste some code first.");return}
    var b=$("save");b.disabled=true;msg("Saving…");try{localStorage.setItem("mia_notes_author",$("author").value)}catch(e){}
    api("POST",{author:$("author").value.trim()||"Anonymous",title:$("title").value.trim()||"Untitled snippet",code:code}).then(function(){$("code").value="";$("title").value="";$("stats").textContent="";msg("✅ Saved!");return load()}).catch(function(e){msg("⚠️ "+e.message+" — your code is still in the box.")}).finally(function(){b.disabled=false})};
  if(pass)load();
})();
</script>
</body></html>
